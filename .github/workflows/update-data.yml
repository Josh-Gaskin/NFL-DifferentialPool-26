name: Update FPI & Schedule Data

on:
  schedule:
    # Every Tuesday at 13:00 UTC (~9am ET) - after MNF, before the next slate.
    # During the season you may also want a run right before your weekly
    # lock-in deadline; add another cron line if so.
    - cron: "0 13 * * 2"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run fetch script
        run: python scripts/fetch_data.py

      - name: Commit updated data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "chore: update FPI/schedule data ($(date -u +%Y-%m-%d))"
            git push
          fi
