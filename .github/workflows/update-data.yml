name: Update FPI & Schedule Data

on:
  schedule:
    # This job pulls FPI ratings, the schedule, AND completed-game scores
    # all in one run, so its frequency controls how quickly all three
    # update - including how fast auto-filled results show up after a game.
    #
    # Cron format: minute hour day month day-of-week (all in UTC).
    # Running it more often costs nothing extra of consequence: each run
    # takes a few minutes, and GitHub Actions minutes are unlimited for
    # public repos (2,000 free/month on a private repo - still ~1% of that
    # budget even run several times a day).
    #
    # Current default: twice a day, so a Thursday/Sunday/Monday night
    # result is reflected on the site by the next morning at the latest.
    - cron: "0 13 * * *"  # 9am ET every day
    - cron: "0 4 * * *"   # midnight ET every day
    # Want results faster on game nights? Add more lines like:
    # - cron: "0 3,6,9 * * 1,5,2"  # 11pm/2am/5am ET on Mon, Fri, Tue nights (MNF/TNF + Sunday spillover)
    # Test any change by using "Run workflow" in the Actions tab - it uses
    # workflow_dispatch below regardless of the cron schedule.
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run fetch script
        run: python scripts/fetch_data.py

      - name: Commit updated data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "chore: update FPI/schedule data ($(date -u +%Y-%m-%d))"
            git push
          fi
